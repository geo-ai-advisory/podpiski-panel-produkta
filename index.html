<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'SF Pro Text','Segoe UI',Roboto,sans-serif;background:#f5f6fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px 44px;max-width:420px;width:100%;text-align:center}

p{font-size:14px;color:#636e72;margin-bottom:24px}

input:focus{border-color:#0984e3}
button{width:100%;margin-top:14px;padding:13px;font-size:15px;font-weight:600;background:#0984e3;color:#fff;border:none;border-radius:10px;cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s}
button:hover{background:#0770c2;box-shadow:0 4px 12px rgba(9,132,227,.3)}
button:active{background:#0662ab;transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.err{color:#d63031;font-size:13px;margin-top:12px;min-height:18px}
</style>

function b2a(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function unlock(){
 var pw=document.getElementById('pw').value;
 var err=document.getElementById('err');
 err.textContent='';
 try{
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  var html=new TextDecoder().decode(pt);
  document.open();
  document.write(html);
  document.close();
 }catch(e){err.textContent='Неверный пароль'}
}
document.getElementById('btn').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
</script>
